# CodeQL configuration for computah.
#
# The barrier model lives in .github/codeql/extensions/ and is AUTO-DISCOVERED
# by CodeQL advanced setup — it must NOT be listed under `packs:` (that key is
# only for packs published to a registry; a bare name there makes CodeQL try
# to pull it from ghcr.io and fail). See extensions/computah-barriers.model.yml.
#
# NOTE: Go barrier/model packs are, as of this writing, not in the set of
# languages CodeQL model packs officially support (C#, Java/Kotlin, Ruby, and
# a few others). The extension is placed correctly so it takes effect if/when
# Go is supported, and is harmless (ignored) otherwise. If the ConfinePath
# path-injection alerts persist after this runs, they are false positives that
# should be dismissed in the Security tab with a "used in tests"/"won't fix —
# sanitized by ConfinePath" justification rather than worked around in code.
name: computah CodeQL config

queries:
  - uses: security-and-quality
