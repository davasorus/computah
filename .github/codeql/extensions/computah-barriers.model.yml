# CodeQL model pack: declares computah's own path-safety barrier so the
# go/path-injection query recognizes ConfinePath as a sanitizer.
#
# ConfinePath resolves a user/model-supplied path against a base directory and
# returns an error unless the result is provably contained within that base
# (rejecting absolute escapes, "..", and sibling-prefix tricks). Its return
# value is therefore safe to pass to a filesystem sink. CodeQL's built-in
# dataflow can't infer this, so we model it explicitly. See internal/core/pathsafe.go.
#
# LogSafe strips CR/LF and other C0 controls (plus DEL) from a value before it
# is written to a log/terminal line. As of the fix for the 3 go/log-injection
# alerts that persisted despite LogSafe being applied everywhere, LogSafe's
# CR/LF removal is implemented via strings.ReplaceAll (not strings.Map), which
# IS the built-in ReplaceSanitizer pattern the go/log-injection query already
# recognizes — so CodeQL confirms sanitization natively and this barrier-model
# row is no longer load-bearing for that query. It (and the row below) also
# can't take effect via this file anyway: Go is not yet in the set of
# languages CodeQL model packs officially support. The row is kept as a
# forward-compatible fallback should either fact change. See
# internal/core/logsafe.go.
extensions:
  - addsTo:
      pack: codeql/go-all
      extensible: barrierModel
    data:
      # package, type(blank=free func), subtypes, name, signature, ext, output, kind, provenance
      - ["github.com/davasorus/computah/internal/core", "", false, "ConfinePath", "", "", "ReturnValue[0]", "path-injection", "manual"]
      - ["github.com/davasorus/computah/internal/core", "", false, "LogSafe", "", "", "ReturnValue[0]", "log-injection", "manual"]
